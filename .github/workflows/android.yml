name: Android release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and verify
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease bundleRelease
      - name: Generate wrapper for source distribution
        run: gradle wrapper --gradle-version 8.13
      - name: Package source
        run: zip -r DynamicIsland-source.zip . -x '.git/*' '.gradle/*' 'app/build/*' 'DynamicIsland-source.zip' 'local.properties'
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html
            DynamicIsland-source.zip
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --title "Dynamic Island ${GITHUB_RUN_NUMBER}" --notes "Personal-use release, debug-key signed, R8 minified. See README for setup and device-testing limitations." app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab DynamicIsland-source.zip
